<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — SIPCONS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
  <link rel="icon" href="../img/favicon.ico" />
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    :root {
      --bg: #f0f3f7;
      --card: #ffffff;
      --border: #d5dce5;
      --text: #1f2b3a;
      --muted: #5f6f82;
      --primary: #0f4c81;
      --primary-hover: #0b3d68;
      --focus: rgba(15,76,129,0.18);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--text);
    }

    .login-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 36px 32px 32px;
      box-shadow: 0 1px 3px rgba(20,40,70,0.08), 0 8px 24px -12px rgba(20,40,70,0.15);
    }

    .logo {
      display: block;
      width: 220px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 28px;
    }

    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    .input-wrapper { position: relative; }

    input {
      width: 100%;
      height: 42px;
      padding: 0 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--text);
      background: #fff;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder { color: #9aa7b6; }

    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--focus);
    }

    #password { padding-right: 40px; }

    .toggle-password {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .toggle-password:hover { color: var(--primary); }

    .error-msg {
      display: none;
      background: #fdf2f2;
      border: 1px solid #f3c2c0;
      color: #a8322b;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }

    .error-msg.visible { display: flex; }

    .btn-login {
      width: 100%;
      height: 42px;
      margin-top: 6px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 6px;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-login:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .page-footer {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }

    @media (max-width: 440px) {
      .login-card { padding: 28px 22px 26px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<main class="login-card">
  <img class="logo" src="../img/logo-sipcons.png" alt="SIPCONS — Soluciones Integrales de Pesaje y Control, S.A. de C.V." />

  <div class="error-msg" id="errorMsg" role="alert">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errorText">Usuario o contraseña incorrectos</span>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="usuario">Usuario</label>
      <input type="text" id="usuario" name="usuario" autocomplete="username" required autofocus />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <i class="fas fa-eye toggle-password" id="togglePwd" title="Mostrar contraseña"></i>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Iniciar sesión</span>
    </button>
  </form>
</main>

<footer class="page-footer">&copy; <span id="year"></span> SIPCONS. Uso exclusivo de personal autorizado.</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Toggle mostrar/ocultar contraseña
  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const isText = pwd.type === 'text';
    pwd.type = isText ? 'password' : 'text';
    this.classList.toggle('fa-eye', isText);
    this.classList.toggle('fa-eye-slash', !isText);
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const btn      = document.getElementById('btnLogin');
    const spinner  = document.getElementById('spinner');
    const btnText  = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorTxt = document.getElementById('errorText');

    // Estado cargando
    btn.disabled       = true;
    spinner.style.display = 'block';
    btnText.textContent   = 'Verificando...';
    errorMsg.classList.remove('visible');

    try {
      const formData = new FormData(this);
      const res  = await fetch('login.php', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.success) {
        btnText.textContent = 'Acceso concedido';
        window.location.href = data.redirect || '../index.html';
      } else {
        errorTxt.textContent = data.message || 'Usuario o contraseña incorrectos';
        errorMsg.classList.add('visible');
        btn.disabled       = false;
        spinner.style.display = 'none';
        btnText.textContent   = 'Iniciar sesión';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    } catch (_) {
      errorTxt.textContent = 'Error de conexión. Intenta de nuevo.';
      errorMsg.classList.add('visible');
      btn.disabled       = false;
      spinner.style.display = 'none';
      btnText.textContent   = 'Iniciar sesión';
    }
  });
</script>

</body>
</html>
