<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — SIPCONS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
  <link rel="icon" href="../img/favicon.ico" />
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    :root {
      --navy: #0f4c81;
      --navy-dark: #0b3a63;
      --blue: #2f8fd6;
      --ink: #1c2733;
      --line: #d8dee5;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", "Segoe UI", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background:
        radial-gradient(900px 500px at 50% -10%, rgba(47,143,214,0.10), transparent 65%),
        #eef2f6;
      color: var(--ink);
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: #fff;
      border-radius: 16px;
      padding: 44px 36px 36px;
      box-shadow: 0 1px 2px rgba(15,40,70,0.06), 0 24px 60px -20px rgba(15,40,70,0.25);
    }

    .logo {
      display: block;
      width: 260px;
      max-width: 100%;
      height: auto;
      margin: 0 auto 36px;
    }

    .form-group { margin-bottom: 16px; }

    .input-wrapper { position: relative; }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #9aa6b2;
      font-size: 0.9rem;
      transition: color 0.2s;
    }

    .input-wrapper:focus-within > i:not(.toggle-password) { color: var(--blue); }

    .input-wrapper input {
      width: 100%;
      padding: 13px 14px 13px 40px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      background: #f8fafc;
      transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
      outline: none;
    }

    .input-wrapper input::placeholder { color: #a3adb8; }

    .input-wrapper input:focus {
      border-color: var(--blue);
      background: #fff;
      box-shadow: 0 0 0 4px rgba(47,143,214,0.14);
    }

    .input-wrapper .toggle-password {
      left: auto;
      right: 14px;
      cursor: pointer;
    }

    .input-wrapper .toggle-password:hover { color: var(--blue); }

    .error-msg {
      display: none;
      background: #fdf2f2;
      border: 1px solid #f5c6cb;
      color: #b8322a;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 16px;
      align-items: center;
      gap: 8px;
    }

    .error-msg.visible { display: flex; }

    .btn-login {
      width: 100%;
      margin-top: 8px;
      padding: 13px;
      background: linear-gradient(135deg, var(--navy-dark), var(--navy));
      color: #fff;
      border: none;
      border-radius: 10px;
      font: inherit;
      font-size: 0.98rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      cursor: pointer;
      box-shadow: 0 8px 20px -8px rgba(15,76,129,0.7);
      transition: transform 0.1s, box-shadow 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover:not(:disabled) { box-shadow: 0 10px 24px -8px rgba(15,76,129,0.85); }
    .btn-login:active:not(:disabled) { transform: scale(0.99); }
    .btn-login:focus-visible { outline: 3px solid rgba(47,143,214,0.4); outline-offset: 2px; }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 440px) {
      .login-card { padding: 36px 24px 28px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; animation-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>

<main class="login-card">
  <img class="logo" src="../img/logo-sipcons.png" alt="SIPCONS — Soluciones Integrales de Pesaje y Control, S.A. de C.V." />

  <div class="error-msg" id="errorMsg" role="alert">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errorText">Usuario o contraseña incorrectos</span>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <div class="input-wrapper">
        <i class="fas fa-user"></i>
        <input
          type="text"
          id="usuario"
          name="usuario"
          placeholder="Usuario"
          aria-label="Usuario"
          autocomplete="username"
          required
          autofocus
        />
      </div>
    </div>

    <div class="form-group">
      <div class="input-wrapper">
        <i class="fas fa-lock"></i>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="Contraseña"
          aria-label="Contraseña"
          autocomplete="current-password"
          required
        />
        <i class="fas fa-eye toggle-password" id="togglePwd" title="Mostrar contraseña"></i>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <div class="spinner" id="spinner"></div>
      <i class="fas fa-right-to-bracket" id="btnIcon"></i>
      <span id="btnText">Iniciar sesión</span>
    </button>
  </form>
</main>

<script>
  // Toggle mostrar/ocultar contraseña
  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const isText = pwd.type === 'text';
    pwd.type = isText ? 'password' : 'text';
    this.classList.toggle('fa-eye', isText);
    this.classList.toggle('fa-eye-slash', !isText);
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const btn      = document.getElementById('btnLogin');
    const spinner  = document.getElementById('spinner');
    const btnIcon  = document.getElementById('btnIcon');
    const btnText  = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorTxt = document.getElementById('errorText');

    // Estado cargando
    btn.disabled       = true;
    spinner.style.display = 'block';
    btnIcon.style.display = 'none';
    btnText.textContent   = 'Verificando...';
    errorMsg.classList.remove('visible');

    try {
      const formData = new FormData(this);
      const res  = await fetch('login.php', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.success) {
        btnText.textContent = 'Acceso concedido';
        window.location.href = data.redirect || '../index.html';
      } else {
        errorTxt.textContent = data.message || 'Usuario o contraseña incorrectos';
        errorMsg.classList.add('visible');
        btn.disabled       = false;
        spinner.style.display = 'none';
        btnIcon.style.display = 'inline';
        btnText.textContent   = 'Iniciar sesión';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    } catch (_) {
      errorTxt.textContent = 'Error de conexión. Intenta de nuevo.';
      errorMsg.classList.add('visible');
      btn.disabled       = false;
      spinner.style.display = 'none';
      btnIcon.style.display = 'inline';
      btnText.textContent   = 'Iniciar sesión';
    }
  });
</script>

</body>
</html>
