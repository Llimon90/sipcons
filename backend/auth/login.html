<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — SIPCONS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a252f 0%, #2c3e50 50%, #34495e 100%);
    }

    .login-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.4);
      width: 100%;
      max-width: 400px;
      overflow: hidden;
    }

    .login-header {
      background: linear-gradient(135deg, #2c3e50 0%, #34495e 100%);
      padding: 36px 32px 28px;
      text-align: center;
    }

    .login-header .logo-icon {
      width: 60px;
      height: 60px;
      background: rgba(52,152,219,0.2);
      border: 2px solid rgba(52,152,219,0.5);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
    }

    .login-header .logo-icon i {
      font-size: 1.6rem;
      color: #3498db;
    }

    .login-header h1 {
      color: #ecf0f1;
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .login-header p {
      color: rgba(236,240,241,0.6);
      font-size: 0.82rem;
      margin-top: 6px;
      letter-spacing: 0.5px;
    }

    .login-body {
      padding: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #555;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #aaa;
      font-size: 0.9rem;
    }

    .input-wrapper input {
      width: 100%;
      padding: 12px 14px 12px 40px;
      border: 1.5px solid #ddd;
      border-radius: 8px;
      font-size: 0.95rem;
      color: #333;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .input-wrapper input:focus {
      border-color: #3498db;
      box-shadow: 0 0 0 3px rgba(52,152,219,0.12);
    }

    .input-wrapper .toggle-password {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      left: auto;
      cursor: pointer;
      color: #aaa;
      transition: color 0.2s;
    }

    .input-wrapper .toggle-password:hover { color: #3498db; }

    .error-msg {
      display: none;
      background: #fdf2f2;
      border: 1px solid #f5c6cb;
      color: #c0392b;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.85rem;
      margin-bottom: 18px;
      align-items: center;
      gap: 8px;
    }

    .error-msg.visible { display: flex; }

    .btn-login {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #2980b9, #3498db);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-login:hover:not(:disabled) { opacity: 0.92; }
    .btn-login:active:not(:disabled) { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.4);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .login-footer {
      text-align: center;
      padding: 0 32px 24px;
      font-size: 0.78rem;
      color: #aaa;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-header">
    <div class="logo-icon">
      <i class="fas fa-shield-halved"></i>
    </div>
    <h1>SIPCONS</h1>
    <p>Sistema de gestión de servicios</p>
  </div>

  <div class="login-body">
    <div class="error-msg" id="errorMsg">
      <i class="fas fa-circle-exclamation"></i>
      <span id="errorText">Usuario o contraseña incorrectos</span>
    </div>

    <form id="loginForm" autocomplete="off">
      <div class="form-group">
        <label for="usuario">Usuario</label>
        <div class="input-wrapper">
          <i class="fas fa-user"></i>
          <input
            type="text"
            id="usuario"
            name="usuario"
            placeholder="Ingresa tu usuario"
            autocomplete="username"
            required
          />
        </div>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="input-wrapper">
          <i class="fas fa-lock"></i>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            required
          />
          <i class="fas fa-eye toggle-password" id="togglePwd" title="Mostrar contraseña"></i>
        </div>
      </div>

      <button type="submit" class="btn-login" id="btnLogin">
        <div class="spinner" id="spinner"></div>
        <i class="fas fa-right-to-bracket" id="btnIcon"></i>
        <span id="btnText">Iniciar sesión</span>
      </button>
    </form>
  </div>

  <div class="login-footer">
    &copy; <span id="year"></span> SIPCONS &mdash; Acceso restringido
  </div>
</div>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  // Toggle mostrar/ocultar contraseña
  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const isText = pwd.type === 'text';
    pwd.type = isText ? 'password' : 'text';
    this.classList.toggle('fa-eye', isText);
    this.classList.toggle('fa-eye-slash', !isText);
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const btn      = document.getElementById('btnLogin');
    const spinner  = document.getElementById('spinner');
    const btnIcon  = document.getElementById('btnIcon');
    const btnText  = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorTxt = document.getElementById('errorText');

    // Estado cargando
    btn.disabled       = true;
    spinner.style.display = 'block';
    btnIcon.style.display = 'none';
    btnText.textContent   = 'Verificando...';
    errorMsg.classList.remove('visible');

    try {
      const formData = new FormData(this);
      const res  = await fetch('login.php', { method: 'POST', body: formData });
      const data = await res.json();

      if (data.success) {
        btnText.textContent = 'Acceso concedido';
        window.location.href = data.redirect || '../index.html';
      } else {
        errorTxt.textContent = data.message || 'Usuario o contraseña incorrectos';
        errorMsg.classList.add('visible');
        btn.disabled       = false;
        spinner.style.display = 'none';
        btnIcon.style.display = 'inline';
        btnText.textContent   = 'Iniciar sesión';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    } catch (_) {
      errorTxt.textContent = 'Error de conexión. Intenta de nuevo.';
      errorMsg.classList.add('visible');
      btn.disabled       = false;
      spinner.style.display = 'none';
      btnIcon.style.display = 'inline';
      btnText.textContent   = 'Iniciar sesión';
    }
  });
</script>

</body>
</html>
