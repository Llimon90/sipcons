<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Clientes</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
  <link rel="icon" href="../img/favicon.ico" />
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/styles.css?v=20261125">
    <link rel="stylesheet" href="../css/dark.css?v=20261101">
    <link rel="stylesheet" href="../branding/tema.css.php">
    <script src="../branding/marca.js.php"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <script src="../scripts/auth-guard.js?v=20261124"></script>
  <script src="../scripts/dialogo.js?v=20261101"></script>
  <script src="../scripts/menu-lateral.js?v=20261127"></script>
  <script src="../scripts/formularios.js?v=20261125"></script>
  <link rel="stylesheet" href="../css/formularios.css?v=20261030">
</head>

<body>
  <!-- Botón Inicio Móvil -->
  <button class="mobile-home-btn" onclick="window.location.href='../index.html'">
    <i class="fas fa-home"></i>
    <span>Volver al Inicio</span>
  </button>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title"><i class="fas fa-tools"></i> Panel</h2>
      <button id="toggleSidebar" class="toggle-sidebar"><i class="fas fa-chevron-left"></i></button>
    </div>
    
    <ul><!-- Menú por áreas: lo arma scripts/menu-lateral.js --></ul>

    <div class="sidebar-footer">
      <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <span class="user-name">Técnico</span>
      </div>
    </div>
  </aside>

  <main id="mainContent">
    <section class="encabezado">
      <form id="new-incidencia-form">
        <h2>Registrar Nuevo Cliente</h2>
        <div class="form-row">
          <div>  
            <label for="nombre">Nombre del Cliente o razón social:</label>
            <input type="text" id="nombre" name="nombre" required>
          </div>
          <div>
            <label for="rfc">RFC:</label>
            <input type="text" id="rfc" name="rfc">
          </div>
        </div>  

        <div class="form-row">
          <div>  
            <label for="direccion">Dirección:</label>
            <input type="text" id="direccion" name="direccion" placeholder="Ejemplo: Corporativo">
          </div>
          <div>
            <label for="telefono">Teléfono:</label>
            <input type="text" id="telefono" name="telefono" placeholder="Con clave lada">
          </div>
        </div>

        <div class="form-row">
          <div>
            <label for="email">E-mail:</label>
            <input type="text" id="email" name="email" placeholder="Ejemplo: cliente@dominio.com">
          </div>
        </div>

        <div style="margin: 10px 0 20px;">
          <label>Contactos:</label>
          <div id="contactos-editor"></div>
          <input type="hidden" id="contactos" name="contactos_json">
        </div>
        
        <button type="submit" class="btn-primary">Guardar Cliente</button>
      </form>

      <section class="lista-incidencias" style="margin-top: 40px;">
        <div class="clientes-cabecera" style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;">
          <h2>Directorio de Clientes</h2>
          <span class="clientes-importar" data-solo-administra hidden style="gap:8px; flex-wrap:wrap;">
            <a href="importar.html?tipo=clientes" class="btn-secundario"><i class="fas fa-file-import"></i> Importar clientes</a>
            <a href="importar.html?tipo=equipos" class="btn-secundario"><i class="fas fa-file-import"></i> Importar equipos</a>
          </span>
        </div>     
        <p style="color: #7f8c8d; font-size: 0.9rem;">Haz clic en el nombre de un cliente para ver su perfil completo y su padrón de equipos.</p>
        
        <div class="form-row">
            <input type="text" id="campo-busqueda" name="busqueda-cliente" placeholder="Buscar por nombre, RFC o teléfono..." style="padding:10px; width:100%; border:1px solid #ccc; border-radius:5px;">
        </div>
        
        <table class="tabla-ventas" style="width: 100%; margin-top: 15px;">
          <thead>
            <tr>
              <th>Nombre del Cliente</th>
              <th>RFC</th>
              <th>Dirección</th>
              <th>Teléfono</th>
              <th>Contactos</th>
              <th>Email</th>
            </tr>
          </thead>
          <tbody id="lista-clientes">
            <!-- Los datos aparecerán aquí mediante JS -->
          </tbody>
        </table>
      </section>
    </section>
  </main>
  
  <script src="../scripts/sidebar-state.js?v=20261125"></script>
  <script src="../scripts/ui-tablas.js?v=20261110"></script>
  <!-- ACTUALIZA ESTE SCRIPT PARA QUE HAGA REDIRECCIÓN EN LUGAR DE ABRIR MODAL -->
  <script src="../scripts/contactos-widget.js?v=20261005"></script>
  <script>AppContactos.init(document.getElementById('contactos-editor'), document.getElementById('contactos'));</script>
  <script src="../scripts/carga-clientes.js?v=20261101"></script> 
  <script src="../scripts/script-clientes.js?v=20261101"></script>
</body>
</html>
