<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Incidencia</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
  <link rel="icon" href="../img/favicon.ico" />
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
    <link rel="stylesheet" href="../css/styles.css?v=20261009d">
    <link rel="stylesheet" href="../css/dark.css?v=20261009b">
    <link rel="stylesheet" href="../css/detalle.css?v=8">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js" crossorigin="anonymous"></script>
  <script src="../scripts/auth-guard.js?v=20261009c"></script>
  <script src="../scripts/menu-lateral.js?v=20261126"></script>
</head>
<body>

    <!-- Botón Inicio Móvil -->
    <button class="mobile-home-btn" onclick="window.location.href='../index.html'">
        <i class="fas fa-home"></i>
        <span>Volver al Inicio</span>
    </button>

    <!-- Panel lateral mejorado -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title">
                <i class="fas fa-tools"></i>
                Panel
            </h2>
            <button id="toggleSidebar" class="toggle-sidebar">
                <i class="fas fa-chevron-left"></i>
            </button>
        </div>
        
        <ul><!-- Menú por áreas: lo arma scripts/menu-lateral.js --></ul>

        <div class="sidebar-footer">
            <div class="user-info">
                <i class="fas fa-user-circle"></i>
                <span class="user-name">Técnico</span>
            </div>
        </div>
    </aside>

    <!-- CONTENIDO ORIGINAL EXACTO -->
  <main id="mainContent">
        <!-- Formulario para ACTUALIZAR una incidencia -->
        <section class="encabezado">
            <h2>Detalles de la Incidencia</h2>
            <div id="detalle-incidencia">
                <p>Cargando detalles...</p>
            </div>
        </section>
        
        <section class="archivos-incidencia">
            <h2>Archivos de la Incidencia</h2>
            <div id="contenedor-archivos"></div>
        </section>

        <!-- ============================================================ -->
        <!-- Extras de esta incidencia: etiquetas, bitácora de tiempo y
             plantillas de respuesta rápida. Sección independiente del
             formulario principal (no comparte estado con detalle.js). -->
        <!-- ============================================================ -->
        <section class="archivos-incidencia" id="seccion-extras-incidencia">
            <h2>Etiquetas</h2>
            <div id="etiquetas-asignadas" class="etiquetas-chips"></div>
            <div style="margin-top:8px;">
                <select id="selector-etiqueta"><option value="">Agregar etiqueta...</option></select>
            </div>

            <h2 style="margin-top:20px;">Plantilla de respuesta rápida</h2>
            <p style="color:#7f8c8d; margin-top:-6px;">Inserta un texto predefinido en las notas adicionales.</p>
            <select id="selector-plantilla"><option value="">Selecciona una plantilla...</option></select>

            <h2 style="margin-top:20px;">Bitácora de tiempo</h2>
            <div id="bitacora-tiempo-lista"></div>
            <div class="form-row" style="margin-top:8px;">
                <div>
                    <label for="bitacora-minutos">Minutos invertidos</label>
                    <input type="number" id="bitacora-minutos" min="1" max="1440" style="width:100px;">
                </div>
                <div>
                    <label for="bitacora-descripcion">Descripción (opcional)</label>
                    <input type="text" id="bitacora-descripcion" maxlength="255">
                </div>
            </div>
            <button type="button" id="btn-agregar-tiempo">Registrar tiempo</button>
            <span id="mensaje-bitacora" style="margin-left:10px;"></span>
        </section>
    </main>

    <script src="../scripts/sidebar-state.js?v=20261002"></script>
    <script src="../scripts/contactos-widget.js?v=3"></script>
    <script src="../scripts/serie-equipo.js"></script>
    <script src="../scripts/tecnicos.js?v=2"></script>
    <script src="../scripts/visor-archivos.js?v=3"></script>
    <script src="../scripts/dialogo.js?v=2"></script>
    <script src="../scripts/selector-archivos.js?v=2"></script>
    <script src="../scripts/detalle.js?v=20"></script>
    <script src="../scripts/detalle-extras.js?v=1"></script>
</body>
</html>
