    <style>
        .notificacion {
            position: fixed; top: 20px; right: 20px; padding: 15px 25px;
            border-radius: 5px; color: white; font-weight: bold; z-index: 9999;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1); animation: slideIn 0.3s ease-out;
        }
        .notificacion.success { background-color: #2ecc71; }
        .notificacion.error { background-color: #e74c3c; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        .eliminando { opacity: 0.5; pointer-events: none; }
    </style>
  <script src="../scripts/auth-guard.js?v=20261124"></script>

</head>
<body>

    <button class="mobile-home-btn" onclick="window.location.href='../index.html'" style="display: none;">
        <i class="fas fa-home"></i> <span>Volver al Inicio</span>
    </button>

    <aside class="sidebar">
        <div class="sidebar-header">
            <h2 class="sidebar-title"><i class="fas fa-tools"></i> Panel</h2>
            <button id="toggleSidebar" class="toggle-sidebar"><i class="fas fa-chevron-left"></i></button>
        </div>
        <ul><!-- Menú por áreas: lo arma scripts/menu-lateral.js --></ul>
        <div class="sidebar-footer">
            <div class="user-info"><i class="fas fa-user-circle"></i> <span class="user-name">Administrador</span></div>
        </div>
    </aside>

    <main id="mainContent">
        <section class="encabezado">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2><i class="fas fa-edit"></i> Detalles de la Venta <span id="txt-folio" style="color: var(--brand-primary);"></span></h2>
                <div>
                    <button type="button" onclick="window.location.href='admin-ventas.html'" class="btn-secundario">
                        <i class="fas fa-arrow-left"></i> Regresar
                    </button>
                    <button type="button" id="btn-eliminar-venta" class="btn-rojo">
                        <i class="fas fa-trash-alt"></i> Eliminar Venta
                    </button>
                </div>
            </div>

            <form id="form-editar-venta" enctype="multipart/form-data">
                <input type="hidden" id="venta_id" name="venta_id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha_venta"><i class="fas fa-calendar-alt"></i> FECHA DE VENTA:</label>
                        <input type="date" id="fecha_venta" name="fecha_venta" required>
                    </div>
                    <div class="form-group">
                        <label for="cliente">CLIENTE:</label>
                        <input type="text" id="cliente" name="cliente" required>
                    </div>
                    <div class="form-group">
                        <label for="sucursal">SUCURSAL:</label>
                        <input type="text" id="sucursal" name="sucursal">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group" style="flex: 1 1 100%;">
                        <label for="articulo_id">ARTÍCULO DE INVENTARIO (OPCIONAL):</label>
                        <select id="articulo_id" name="articulo_id">
                            <option value="">— Sin vincular al inventario —</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>EQUIPO:</label>
                        <input type="text" id="equipo" name="equipo" required>
                    </div>
                    <div class="form-group">
                        <label>MARCA:</label>
                        <input type="text" id="marca" name="marca" required>
                    </div>
                    <div class="form-group">
                        <label>MODELO:</label>
                        <input type="text" id="modelo" name="modelo" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>CANTIDAD:</label>
                        <input type="number" id="qty" name="qty" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>GARANTÍA (MESES):</label>
                        <input type="number" id="garantia" name="garantia" min="0">
                    </div>
                    <div class="form-group">
                        <label>MANTENIMIENTO CADA (MESES):</label>
                        <input type="number" id="calibracion" name="calibracion" min="0" placeholder="0 = no aplica">
                    </div>
                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; margin-top: 10px;">
                            <input type="checkbox" id="servicio" name="servicio" class="f-switch">
                            <strong>CLIENTE CON PÓLIZA / ACUERDO DE MANTENIMIENTO</strong>
                        </label>
                    </div>
                </div>

                <div id="aviso-periodicidad" style="font-size: 0.85rem; margin-bottom: 15px; padding: 8px 10px; background: #f1f5f9; border-radius: 5px;"></div>

                <div class="form-group" style="width: 100%;">
                    <label><strong>NÚMEROS DE SERIE:</strong></label>
                    <div id="container-series-edit" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; background: #f8f9fa; padding: 15px; border-radius: 5px;">
                        </div>
                </div>

                <div class="form-group" style="width: 100%;">
                    <label>NOTAS ADICIONALES:</label>
                    <textarea id="notas" name="notas" style="width: 100%; height: 80px;"></textarea>
                </div>

                <section class="archivos-incidencia" style="background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); width: 100%; margin-bottom: 20px;">
                    <h2><i class="fas fa-folder-open"></i> Archivos de la Venta</h2>
                    
                    <div id="contenedor-archivos" style="display: flex; flex-wrap: wrap; margin-bottom: 20px;">
                        <p style="color: #7f8c8d;">Cargando archivos...</p>
                    </div>

                    <div style="border-top: 1px solid #eee; padding-top: 20px;">
                        <label><strong>AGREGAR NUEVOS ARCHIVOS:</strong></label><br><br>
                        <input type="file" id="nuevos_facturas" name="nuevos_facturas[]" multiple form="form-editar-venta"
                               accept=".pdf,.jpg,.jpeg,.png,.gif,.webp,.doc,.docx,.xls,.xlsx"
                               data-selector data-texto="Toca para elegir facturas o documentos" data-ayuda="PDF, imágenes, Word o Excel">
                        <p style="font-size: 12px; color: #e74c3c; margin-top: 8px;">
                            <i class="fas fa-info-circle"></i> Selecciona los archivos y da clic en "Guardar Cambios" para subirlos.
                        </p>
                    </div>
                </section>

                <div style="margin-bottom: 30px;">
                    <button type="button" id="btn-guardar-cambios" class="btn-primary">
                        <i class="fas fa-save"></i> Guardar Cambios
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script src="../scripts/periodicidad.js?v=20261030c"></script>
    <script src="../scripts/selector-archivos.js?v=20261101"></script>
    <script src="../scripts/detalles-venta.js?v=20261101"></script>
</body>
</html>
