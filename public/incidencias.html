<script>
  // Arreglo global de control para validar consistencia de clientes
  let clientesValidos = [];
  // nombre de cliente (mayúsculas) -> lista de contactos
  let contactosPorCliente = {};

  // Llena el desplegable "Reporta" con los contactos del cliente elegido
  function actualizarContactos() {
      const datalist = document.getElementById('lista-contactos');
      const clave = document.getElementById('cliente').value.trim().toUpperCase();
      datalist.innerHTML = '';
      (contactosPorCliente[clave] || []).forEach(nombre => {
          const option = document.createElement('option');
          option.value = nombre;
          datalist.appendChild(option);
      });
  }

  // Función asíncrona para poblar el datalist con los datos reales del backend
  async function cargarClientesEnDatalist() {
      try {
          const response = await fetch(`../backend/obtener-clientes.php?t=${Date.now()}`, { cache: "no-store" });
          const clientes = await response.json();

          const datalist = document.getElementById('lista-clientes');
          if (datalist) {
              datalist.innerHTML = ''; 
              clientesValidos = [];
              contactosPorCliente = {};

              clientes.forEach(cliente => {
                  const option = document.createElement('option');
                  option.value = cliente.nombre;
                  datalist.appendChild(option);
                  
                  // Indexamos el nombre en mayúsculas para la validación estricta posterior
                  clientesValidos.push(cliente.nombre.trim().toUpperCase());
                  contactosPorCliente[cliente.nombre.trim().toUpperCase()] = AppContactos.parsear(cliente.contactos);
              });
          }
      } catch (error) {
          console.error('Error al cargar clientes:', error);
      }
  }

  document.addEventListener("DOMContentLoaded", function() {
    // 1. Establecer fecha por defecto (tu código original)
    // La fecha del día (hora local) la pone scripts/script.js

    // Cargar la lista asíncrona de clientes en el Datalist
    cargarClientesEnDatalist();

    // Cliente que no existe: se crea aquí mismo y queda seleccionado
    AppAltaRapida.cliente(document.getElementById("cliente"), {
      existe: (nombre) => clientesValidos.includes(nombre.trim().toUpperCase()),
      alCrear: (c) => {
        const clave = c.nombre.trim().toUpperCase();
        const option = document.createElement('option');
        option.value = c.nombre;
        document.getElementById('lista-clientes').appendChild(option);
        clientesValidos.push(clave);
        contactosPorCliente[clave] = [c.contacto];
        document.getElementById('contacto').value = c.contacto;
      }
    });
    AppSerie.vincular(document.getElementById("cliente"), document.getElementById("lista-series"));
    AppSucursales.vincular(document.getElementById("cliente"), document.getElementById("sucursal"));  // D-44

    // Técnicos desde la BD (usuarios con rol técnico/supervisor/administrador)
    AppTecnicos.llenarSelect(document.getElementById("tecnico"), { placeholder: "Seleccione una opción" });

    // El rol Técnico no puede cerrar incidencias con/sin factura
    window.appAplicarRestriccionEstatus(document.getElementById("estatus"));
    if (window.AppEstatus) AppEstatus.conectar(document.getElementById("estatus"), { ancla: 'fila-estatus' });

    const selectCliente = document.getElementById("cliente");
    const selectCategoria = document.getElementById("categoria");

    // Categorías configurables por instancia (INCIDENCIA_CATEGORIAS en .env)
    window.APP_BRAND && APP_BRAND.llenarCategorias(selectCategoria, '');

    selectCliente.addEventListener('input', actualizarContactos);
    // Al cambiar de cliente, un contacto que no pertenece al nuevo cliente se limpia
    let clienteAnterior = '';
    selectCliente.addEventListener('change', function() {
      actualizarContactos();
      const actual = this.value.trim().toUpperCase();
      if (actual === clienteAnterior) return;
      clienteAnterior = actual;

      const inputContacto = document.getElementById('contacto');
      const lista = contactosPorCliente[actual];
      const contacto = inputContacto.value.trim().toLowerCase();
      if (lista && contacto && !lista.some(n => n.toLowerCase() === contacto)) {
        inputContacto.value = '';
      }
    });

    // 3. BLINDAJE: Validación estricta para impedir clientes inventados o errores tipográficos
    selectCliente.addEventListener('input', function() {
        const valorDigitado = this.value.trim().toUpperCase();
        
        if (valorDigitado && !clientesValidos.includes(valorDigitado)) {
            // Detiene el submit nativo del formulario inyectando un estado inválido
            this.setCustomValidity("El cliente escrito no existe. Selecciona un cliente válido de la lista.");
        } else {
            this.setCustomValidity("");
        }
    });
  });
</script>

  <script>
    // D-42: aviso de orden programada al elegir una fecha futura
    (function () {
      var f = document.getElementById('fecha'), a = document.getElementById('aviso-programada');
      if (!f || !a) return;
      var d = new Date(), hoy = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      var pintar = function () { a.hidden = !(f.value && f.value > hoy); };
      f.addEventListener('input', pintar); f.addEventListener('change', pintar);
    })();
  </script>
