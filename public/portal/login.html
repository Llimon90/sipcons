<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portal de clientes — SIPCONS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../img/favicon-32.png" />
  <link rel="icon" href="../../img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body class="portal-auth">

<main class="login-card">
  <img class="logo" src="../../img/logo-sipcons.png" alt="SIPCONS — Soluciones Integrales de Pesaje y Control, S.A. de C.V." />
  <p class="portal-subtitulo">Portal de clientes</p>

  <div class="error-msg" id="errorMsg" role="alert">
    <i class="fas fa-circle-exclamation"></i>
    <span id="errorText">Correo o contraseña incorrectos</span>
  </div>

  <form id="loginForm" autocomplete="off">
    <div class="form-group">
      <label for="email">Correo</label>
      <input type="email" id="email" name="email" autocomplete="username" required autofocus />
    </div>

    <div class="form-group">
      <label for="password">Contraseña</label>
      <div class="input-wrapper">
        <input type="password" id="password" name="password" autocomplete="current-password" required />
        <i class="fas fa-eye toggle-password" id="togglePwd" title="Mostrar contraseña"></i>
      </div>
    </div>

    <button type="submit" class="btn-login" id="btnLogin">
      <div class="spinner" id="spinner"></div>
      <span id="btnText">Iniciar sesión</span>
    </button>
  </form>

  <p class="portal-link"><a href="recuperar.html">Olvidé mi contraseña</a></p>
</main>

<footer class="page-footer">&copy; <span id="year"></span> SIPCONS. Portal exclusivo para clientes registrados.</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();

  document.getElementById('togglePwd').addEventListener('click', function () {
    const pwd = document.getElementById('password');
    const isText = pwd.type === 'text';
    pwd.type = isText ? 'password' : 'text';
    this.classList.toggle('fa-eye', isText);
    this.classList.toggle('fa-eye-slash', !isText);
  });

  document.getElementById('loginForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const btn = document.getElementById('btnLogin');
    const spinner = document.getElementById('spinner');
    const btnText = document.getElementById('btnText');
    const errorMsg = document.getElementById('errorMsg');
    const errorTxt = document.getElementById('errorText');

    btn.disabled = true;
    spinner.style.display = 'block';
    btnText.textContent = 'Verificando...';
    errorMsg.classList.remove('visible');

    try {
      const formData = new FormData(this);
      const res = await fetch('../../backend/portal/login.php', { method: 'POST', body: formData, credentials: 'include' });
      const data = await res.json();

      if (data.success) {
        btnText.textContent = 'Acceso concedido';
        window.location.href = 'mis-tickets.html';
      } else {
        errorTxt.textContent = data.error || 'Correo o contraseña incorrectos';
        errorMsg.classList.add('visible');
        btn.disabled = false;
        spinner.style.display = 'none';
        btnText.textContent = 'Iniciar sesión';
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
      }
    } catch (_) {
      errorTxt.textContent = 'Error de conexión. Intenta de nuevo.';
      errorMsg.classList.add('visible');
      btn.disabled = false;
      spinner.style.display = 'none';
      btnText.textContent = 'Iniciar sesión';
    }
  });
</script>

</body>
</html>
