<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nuevo ticket — Portal SIPCONS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../img/favicon-32.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>

<div class="portal-shell">
  <header class="portal-topbar">
    <img class="logo" src="../../img/logo-sipcons.png" alt="SIPCONS" />
    <nav>
      <a href="mis-tickets.html"><i class="fas fa-arrow-left"></i> Mis tickets</a>
      <a href="#" id="btnSalir">Salir</a>
    </nav>
  </header>

  <section class="card">
    <h2>Nuevo ticket</h2>
    <div class="error-msg" id="errorMsg" role="alert"><i class="fas fa-circle-exclamation"></i><span id="errorText"></span></div>

    <form id="formTicket" autocomplete="off">
      <div class="form-row">
        <div>
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria">
            <option value="">Seleccione una categoría</option>
            <option value="Mr. Tienda/Mr. Chef">Mr. Tienda/Mr. Chef</option>
            <option value="Distribuidora el Florido">Distribuidora el Florido</option>
            <option value="Calimax">Calimax</option>
            <option value="Recolección">Recolección</option>
            <option value="Otros">Otros</option>
          </select>
        </div>
        <div>
          <label for="sucursal">Sucursal</label>
          <input type="text" id="sucursal" name="sucursal" placeholder="Opcional" />
        </div>
      </div>

      <div class="form-row" style="margin-top:16px;">
        <div>
          <label for="prioridad">Prioridad</label>
          <select id="prioridad" name="prioridad">
            <option value="Baja">Baja</option>
            <option value="Media" selected>Media</option>
            <option value="Alta">Alta</option>
            <option value="Crítica">Crítica</option>
          </select>
        </div>
      </div>

      <div class="form-group" style="margin-top:16px;">
        <label for="falla">Describe la falla</label>
        <textarea id="falla" name="falla" rows="4" required placeholder="Cuéntanos qué está pasando"></textarea>
      </div>

      <div class="form-group">
        <label for="archivos">Archivos (opcional)</label>
        <input type="file" id="archivos" name="archivos[]" multiple />
      </div>

      <button type="submit" class="btn-login" id="btnEnviar" style="max-width:220px;">Registrar ticket</button>
    </form>
  </section>
</div>

<script>
  document.getElementById('formTicket').addEventListener('submit', async function (e) {
    e.preventDefault();
    const btn = document.getElementById('btnEnviar');
    const errorMsg = document.getElementById('errorMsg');
    errorMsg.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = 'Enviando…';

    try {
      const formData = new FormData(this);
      const res = await fetch('../../backend/portal/nuevo-ticket.php', { method: 'POST', body: formData, credentials: 'include' });
      if (res.status === 401) { window.location.href = 'login.html'; return; }
      const data = await res.json();

      if (data.success) {
        window.location.href = 'ticket-detalle.html?id=' + data.id;
      } else {
        document.getElementById('errorText').textContent = data.error || 'No se pudo registrar el ticket.';
        errorMsg.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Registrar ticket';
      }
    } catch (_) {
      document.getElementById('errorText').textContent = 'Error de conexión. Intenta de nuevo.';
      errorMsg.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Registrar ticket';
    }
  });

  document.getElementById('btnSalir').addEventListener('click', async function (e) {
    e.preventDefault();
    try { await fetch('../../backend/portal/logout.php', { method: 'POST', credentials: 'include' }); } catch (_) {}
    window.location.href = 'login.html';
  });
</script>

</body>
</html>
