<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detalle de ticket — Portal SIPCONS</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../../img/favicon-32.png" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <link rel="stylesheet" href="portal.css" />
</head>
<body>

<div class="portal-shell">
  <header class="portal-topbar">
    <img class="logo" src="../../img/logo-sipcons.png" alt="SIPCONS" />
    <nav>
      <a href="mis-tickets.html"><i class="fas fa-arrow-left"></i> Mis tickets</a>
      <a href="#" id="btnSalir">Salir</a>
    </nav>
  </header>

  <section class="card" id="contenedorDetalle"><p class="estado-vacio">Cargando…</p></section>
</div>

<script>
  function escapeHtml(t) {
    return String(t ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  const id = new URLSearchParams(window.location.search).get('id');

  async function cargarDetalle() {
    const contenedor = document.getElementById('contenedorDetalle');
    if (!id) { contenedor.innerHTML = '<p class="estado-vacio">Ticket no especificado.</p>'; return; }

    try {
      const res = await fetch('../../backend/portal/ticket-detalle.php?id=' + encodeURIComponent(id), { credentials: 'include' });
      if (res.status === 401) { window.location.href = 'login.html'; return; }
      const data = await res.json();

      if (!data.success) {
        contenedor.innerHTML = '<p class="estado-vacio">No encontramos ese ticket.</p>';
        return;
      }

      const t = data.ticket;
      const archivos = (t.archivos || []).map(a => `<li><a href="../${escapeHtml(a)}" target="_blank" rel="noopener">${escapeHtml(a.split('/').pop())}</a></li>`).join('');

      contenedor.innerHTML = `
        <h2>Folio ${escapeHtml(t.numero_incidente)}</h2>
        <p style="margin-top:12px;"><span class="badge-estatus">${escapeHtml(t.estatus)}</span></p>
        <div class="form-row" style="margin-top:20px;">
          <div><strong>Categoría</strong><p>${escapeHtml(t.categoria || '—')}</p></div>
          <div><strong>Prioridad</strong><p>${escapeHtml(t.prioridad || 'Media')}</p></div>
          <div><strong>Sucursal</strong><p>${escapeHtml(t.sucursal || '—')}</p></div>
        </div>
        <div style="margin-top:20px;"><strong>Descripción de la falla</strong><p>${escapeHtml(t.falla)}</p></div>
        ${archivos ? `<div style="margin-top:20px;"><strong>Archivos</strong><ul>${archivos}</ul></div>` : ''}
      `;
    } catch (_) {
      contenedor.innerHTML = '<p class="estado-vacio">No se pudo cargar el ticket. Verifica tu conexión e intenta de nuevo.</p>';
    }
  }

  document.getElementById('btnSalir').addEventListener('click', async function (e) {
    e.preventDefault();
    try { await fetch('../../backend/portal/logout.php', { method: 'POST', credentials: 'include' }); } catch (_) {}
    window.location.href = 'login.html';
  });

  cargarDetalle();
</script>

</body>
</html>
