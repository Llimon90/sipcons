<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Soporte Técnico - Documentación</title>
  <link rel="icon" type="image/png" sizes="32x32" href="../img/favicon-32.png" />
  <link rel="icon" href="../img/favicon.ico" />
  <link rel="apple-touch-icon" href="../img/apple-touch-icon.png" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/soporte.css?v=20261029">
  <link rel="stylesheet" href="../css/styles.css?v=20261128">
  <link rel="stylesheet" href="../css/dark.css?v=20261101">
  <link rel="stylesheet" href="../branding/tema.css.php">
  <script src="../branding/marca.js.php"></script>
  <script src="../scripts/auth-guard.js?v=20261124"></script>
  <script src="../scripts/dialogo.js?v=20261101"></script>
  <script src="../scripts/menu-lateral.js?v=20261127"></script>
  <script src="../scripts/formularios.js?v=20261125"></script>
  <link rel="stylesheet" href="../css/formularios.css?v=20261030">
</head>
<body>
  
  <!-- Botón Inicio Móvil -->
  <button class="mobile-home-btn" onclick="window.location.href='../index.html'">
    <i class="fas fa-home"></i>
    <span>Volver al Inicio</span>
  </button>

  <!-- Panel lateral mejorado -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 class="sidebar-title">
        <i class="fas fa-tools"></i>
        Panel
      </h2>
      <button id="toggleSidebar" class="toggle-sidebar">
        <i class="fas fa-chevron-left"></i>
      </button>
    </div>
    
    <ul><!-- Menú por áreas: lo arma scripts/menu-lateral.js --></ul>

    <div class="sidebar-footer">
      <div class="user-info">
        <i class="fas fa-user-circle"></i>
        <span class="user-name">Técnico</span>
      </div>
    </div>
  </aside>

  <!-- CONTENIDO ORIGINAL EXACTO -->
  <main id="mainContent">
    <!-- Encabezado y buscador -->
    <section class="encabezado">
      <h2><i class="fas fa-folder-open"></i> Documentación Técnica</h2>
      
      <div class="breadcrumb" id="breadcrumb">
        <a href="soporte.html">Inicio</a> > <span>Marcas</span>
      </div>
      
      <div class="form-row">
        <div class="search-container">
          <input type="text" id="searchInput" placeholder="Buscar modelo, número de parte...">
          <button id="searchBtn"><i class="fas fa-search"></i></button>
        </div>
        
        <!-- Botón para agregar nuevo modelo -->
        <button id="addModelBtn" class="btn-primary">
          <i class="fas fa-plus"></i> Agregar Nuevo Modelo
        </button>
      </div>
    </section>

    <!-- Contenedor de marcas/modelos/documentos -->
    <section class="lista-incidencias">
      <div id="content-container">
        <!-- Vista de Marcas (inicial) -->
        <div class="model-grid" id="marcas-container">
          <div class="loading">Cargando marcas...</div>
        </div>
        
        <!-- Vista de Modelos -->
        <div class="model-grid" id="modelos-container" style="display:none;"></div>
        
        <!-- Vista de Documentos -->
        <div id="documentos-container" style="display:none;">
          <button class="back-button" id="back-to-models"><i class="fas fa-arrow-left"></i> Volver a modelos</button>
          <h3 id="modelo-title"></h3>
          <div class="doc-list" id="doc-list"></div>
        </div>
      </div>
    </section>

    <!-- Modal para vista previa -->
    <div id="previewModal" class="modal">
      <div class="modal-content">
        <button type="button" class="close-modal" aria-label="Cerrar">&times;</button>
        <h3>Vista Previa del Documento</h3>
        <iframe id="pdfViewer" src="" frameborder="0"></iframe>
      </div>
    </div>

    <!-- Modal para agregar nuevo modelo -->
    <div id="addModelModal" class="modal" style="display:none;">
      <div class="modal-content">
        <button type="button" class="close-modal" aria-label="Cerrar">&times;</button>
        <h3>Agregar Nuevo Modelo</h3>
        <form id="modelForm" enctype="multipart/form-data">
          <div class="form-group">
            <label for="marca">Marca:</label>
            <select id="marca" name="marca" required>
              <option value="">Seleccionar marca</option>
            </select>
          </div>
          <div class="form-group">
            <label for="modelo_nombre">Nombre del Modelo:</label>
            <input type="text" id="modelo_nombre" name="modelo_nombre" required>
          </div>
          <div class="form-group">
            <label for="modelo_tipo">Tipo de Equipo:</label>
            <input type="text" id="modelo_tipo" name="modelo_tipo" required>
          </div>
          <div class="form-group">
            <label for="manual_file">Manual (PDF):</label>
            <input type="file" id="manual_file" name="manual_file" accept=".pdf" data-selector data-texto="Toca para elegir el manual" data-ayuda="Un archivo PDF">
          </div>
          <div class="form-group">
            <label for="partes_file">Lista de Partes (PDF):</label>
            <input type="file" id="partes_file" name="partes_file" accept=".pdf" data-selector data-texto="Toca para elegir la lista de partes" data-ayuda="Un archivo PDF">
          </div>
          <div class="form-actions">
            <button type="submit" class="btn-primary">Guardar Modelo</button>
            <button type="button" class="btn-secondary" id="cancelAddModel">Cancelar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="../scripts/sidebar-state.js?v=20261125"></script>
  <script src="../scripts/ui-tablas.js?v=20261110"></script>
  <script src="../scripts/selector-archivos.js?v=20261101"></script>
  <script src="../scripts/soporte.js?v=20261101"></script>
</body>
</html>
