  <!-- CONTENIDO ORIGINAL EXACTO -->
  <main id="mainContent">
    <!-- Sección de registro de usuarios -->
    <section class="encabezado">
      <h2>Dar de alta a un nuevo usuario</h2>
      <form id="alta-usuarios-form">
        <div class="form-row">
          <div>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" required placeholder="Nombre del técnico">
          </div>
          <div>
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" required maxlength="100" autocomplete="off" placeholder="nombre@empresa.com">
            <small class="ayuda-campo">Será su usuario para iniciar sesión.</small>
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="telefono">Teléfono</label>
            <input type="text" id="telefono" name="telefono"  placeholder="Número de teléfono">
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="password">Contraseña</label>
            <input type="text" id="password" name="password" required minlength="8" autocomplete="new-password" placeholder="Mínimo 8 caracteres">
          </div>
          <div>
            <label for="confirm-password">Confirmar Contraseña</label>
            <input type="text" id="confirm-password" name="confirm_password" required minlength="8" autocomplete="new-password" placeholder="Confirmar contraseña">
          </div>
        </div>
        <div class="form-row">
          <div>
            <label for="rol">Rol</label>
            <select id="rol" name="rol" required>
              <option value="Técnico">Técnico</option>
              <option value="Administrativo">Administrativo</option>
              <option value="Supervisor">Supervisor</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>
        </div>
        <button type="submit">Registrar Usuario</button>
      </form>

    </section>  
    
<section class="lista-incidencias">
  <h2>Lista de Usuarios</h2>
  <table id="tabla-usuarios">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Correo (usuario)</th>
        <th>Rol</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody id="tabla-body">
      <!-- Las filas se agregarán dinámicamente aquí -->
    </tbody>
  </table>

 </section> 

  </main>

   <!-- Modal para edición de cliente (oculto inicialmente) -->

        <!-- El formulario de edición se cargará aquí -->
      </div>
      <button onclick="document.getElementById('modal-edicion').style.display = 'none'">Cancelar</button>
