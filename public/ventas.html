  <script>
    // Arreglo global de clientes válidos
    let clientesValidos = [];

    // Función para cargar clientes en el datalist
    async function cargarClientesEnDatalist() {
        try {
            const response = await fetch(`../backend/obtener-clientes.php?t=${Date.now()}`, { cache: "no-store" });
            const clientes = await response.json();

            const datalist = document.getElementById('lista-clientes');
            if (datalist) {
                datalist.innerHTML = ''; 
                clientesValidos = []; 

                clientes.forEach(cliente => {
                    const option = document.createElement('option');
                    option.value = cliente.nombre;
                    datalist.appendChild(option);
                    
                    // Almacenar en mayúsculas para validación
                    clientesValidos.push(cliente.nombre.trim().toUpperCase());
                });
            }
        } catch (error) {
            console.error('Error al cargar clientes:', error);
            AppAviso.alerta('Error al cargar clientes en el listado');
        }
    }
    
    document.addEventListener('DOMContentLoaded', cargarClientesEnDatalist);

    // Validación estricta en tiempo real para el input de clientes
    document.addEventListener('DOMContentLoaded', () => {
        const inputCliente = document.getElementById('cliente');
        
        if (inputCliente) {
            // Cliente que no existe: se crea aquí mismo y queda seleccionado
            AppAltaRapida.cliente(inputCliente, {
                existe: (nombre) => clientesValidos.includes(nombre.trim().toUpperCase()),
                alCrear: (c) => {
                    const option = document.createElement('option');
                    option.value = c.nombre;
                    document.getElementById('lista-clientes').appendChild(option);
                    clientesValidos.push(c.nombre.trim().toUpperCase());
                }
            });
            inputCliente.addEventListener('input', function() {
                const valorDigitado = this.value.trim().toUpperCase();
                
                if (valorDigitado && !clientesValidos.includes(valorDigitado)) {
                    this.setCustomValidity("El cliente escrito no existe. Selecciona un cliente válido de la lista.");
                } else {
                    this.setCustomValidity("");
                }
            });
        }
    });

  </script>
